# panjia 业务系统 preview 站点模板（多成员共用）
# 占位符由 deploy-preview.sh 按成员号替换后上传为 /opt/panjia-preview/conf/member<N>.conf
#   __WEB_PORT__  = 3100+N  客户访问端口
#   __API_PORT__  = 8080+N  该成员本机后端的 frp 隧道口
# 静态产物全员共享同一份 /opt/panjia-preview/dist
server {
    listen __WEB_PORT__;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 带 hash 的静态产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API：转发到宿主机 __API_PORT__（该成员的 frp api 隧道口，通向其本机后端）
    # proxy_pass 末尾带 / —— 去掉 /prod-api 前缀，与本机 vite dev 的 rewrite 行为一致
    location /prod-api/ {
        proxy_pass http://host.docker.internal:__API_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 统一消息推送需要：关闭缓冲 + 长超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100m;
    }

    # SPA 路由 fallback（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
