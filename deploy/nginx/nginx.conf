# ========== Nginx 最小配置示例 ==========
# ★ 部署强制检查项（H1）：
#   1. /api/panjia/* 仅内网/VPN，公网不可达
#   2. deny all 兜底
#   3. 默认 location / return 444
#   4. 上线前必须 nginx -t 通过 + 公网 IP 验证 403/444

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ---------- 限流共享内存区（必须放 http 层）----------
    # 鉴权面基础限流：防暴力/垃圾请求
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    # ---------- 默认 server：未匹配 host 直接断开 ----------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 444 = 无响应直接断开（静默丢弃）
        return 444;
    }

    # ---------- 正式站点 ----------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name license.example.com;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------- 默认兜底 ----------
        location / {
            return 444;
        }

        # ---------- 鉴权面（公网可达，靠 JWT 签名 + SSL Pinning 防护）----------
        location /api/auth/ {
            limit_req zone=auth burst=40 nodelay;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---------- 管理面（仅内网/VPN，公网不可达）----------
        # ★ 仅允许 VPN 网段 + 运维固定 IP；其余一律 403（deny all 兜底）
        location /api/panjia/ {
            allow 10.8.0.0/24;        # WireGuard/VPN 网段（按实际修改）
            allow 203.0.113.10;       # 运维固定 IP（按实际修改）
            deny  all;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---------- 前端静态资源（与管理面同白名单策略）----------
        location /assets/ {
            allow 10.8.0.0/24;
            allow 203.0.113.10;
            deny  all;
            root /var/www/panjia-console;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location = / {
            allow 10.8.0.0/24;
            allow 203.0.113.10;
            deny  all;
            root /var/www/panjia-console;
            try_files $uri $uri/ /index.html;
        }
    }
}
