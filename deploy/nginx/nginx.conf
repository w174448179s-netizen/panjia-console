# ========== Nginx 生产配置（HTTPS + Let's Encrypt）==========
# 鉴权面走 HTTPS（443），HTTP（80）仅用于 ACME 续签 + 跳转 HTTPS
#
# ★ 部署检查项：
#   1. 证书路径：/etc/letsencrypt/live/域名/fullchain.pem（SAN 覆盖 panjia.icu + www.panjia.icu）
#   2. /api/auth/ 鉴权面有限流（防暴力），保持公网开放（客户设备激活/心跳）
#   3. 官网首页（/）：公开访问，无任何认证（对外展示）
#   4. 管理后台（/console/ + /api/）：IP 白名单 + Basic Auth 双保险
#      - 白名单 IP 直接访问（免密）
#      - 非白名单 IP 需要 Basic Auth（家宽 IP 变动时的兜底入口）
#      - 改 IP：同步改 geo 里的 ADMIN_IP + 3 处 location 里的 allow 行
#   5. 续签 cron：每天 3 点检查，自动 reload
#
# 目录约定（docker-compose 挂载）：
#   /var/www/home    ← ./web/home    官网静态页（ui/homepage/）
#   /var/www/console ← ./web/dist    管理后台 SPA（vite base=/console/）

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 限流：激活接口防暴力枚举（5r/m，仅允许极少量重试）
    limit_req_zone $binary_remote_addr zone=activate:10m rate=5r/m;
    # 限流：心跳/Check 正常业务流量（30r/m）
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    # 连接数限制（防单 IP 连接耗尽）
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # ---------- 管理面访问控制 ----------
    # ADMIN_IP = 182.136.186.40（2026-09-05 生效，家宽 IP 变动后改这里）
    # satisfy any：白名单 IP 免密直入；其余 IP 凭 Basic Auth 兜底进入
    # htpasswd 由 docker-compose 挂载到 /etc/nginx/.htpasswd（deploy/nginx/.htpasswd）
    #
    # 管理面限流：只限制非白名单 IP（防 401 爆破/扫描噪音）。
    # geo 标记白名单 → map 把白名单的限流键置空 → nginx 对空键不计限流，
    # 所以你本机访问完全不限速；陌生人 30 次/分钟、突发 50。
    # IP 变动后需同步改：geo 里的 ADMIN_IP + 3 处 location 里的 allow 行
    geo $is_admin_ip {
        default           0;
        182.136.186.40    1;   # ADMIN_IP
    }
    map $is_admin_ip $admin_limit_key {
        0     $binary_remote_addr;
        1     "";
    }
    limit_req_zone $admin_limit_key zone=admin:10m rate=30r/m;
    limit_req_status 429;

    # ---------- HTTP（80）：ACME 续签 + 跳转 HTTPS ----------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt 续签验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 容器健康检查（compose healthcheck 用；不能探 / 因为会被 301 到
        # https://127.0.0.1 导致证书 CN 不匹配 → 健康检查永远失败）
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # 其余全部跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- 默认 HTTPS server：未匹配 host 断开 ----------
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/panjia.icu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panjia.icu/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 444;
    }

    # ---------- 正式站点（官网 + 管理后台）----------
    server {
        listen 443 ssl;
        server_name panjia.icu www.panjia.icu;

        ssl_certificate     /etc/letsencrypt/live/panjia.icu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panjia.icu/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------- 官网首页（公开，无认证）----------
        location / {
            root /var/www/home;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # /console → /console/（补全末尾斜杠，否则落到 location / 返回首页）
        location = /console {
            return 301 /console/;
        }

        # ---------- 管理后台 SPA（/console/，IP 白名单 + Basic Auth）----------
        # 前端以 vite base=/console/ 构建，资源与路由都在 /console/ 前缀下
        location /console/ {
            satisfy any;
            allow 182.136.186.40;   # 你的机器（ADMIN_IP）
            deny  all;
            auth_basic            "panjia-console";
            auth_basic_user_file  /etc/nginx/.htpasswd;
            limit_req zone=admin burst=50 nodelay;   # 仅非白名单 IP 被限流

            root /var/www;
            try_files $uri $uri/ /console/index.html;
        }

        # 后台静态资源缓存（同样锁定）
        location /console/assets/ {
            satisfy any;
            allow 182.136.186.40;   # 你的机器（ADMIN_IP）
            deny  all;
            auth_basic            "panjia-console";
            auth_basic_user_file  /etc/nginx/.htpasswd;
            limit_req zone=admin burst=50 nodelay;   # 仅非白名单 IP 被限流

            root /var/www;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ---------- 鉴权面（公网可达，限流 + JWT 防护）----------
        # 激活接口（严格限流：5r/m，防授权码暴力枚举）
        location /api/auth/activate {
            limit_req zone=activate burst=10 nodelay;
            limit_conn conn_per_ip 5;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # 心跳/Check 接口（正常限流：30r/m）
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            limit_conn conn_per_ip 10;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---------- 管理面 API（IP 白名单 + Basic Auth）----------
        # 注意：必须用 /api/ 全量代理——/api/v1/* 全是管理接口，
        # 如果只代理 /api/panjia/ 之类的前缀，其余 API 会落到静态 location，
        # GET 返回 index.html、POST 直接 405
        location /api/ {
            satisfy any;
            allow 182.136.186.40;   # 你的机器（ADMIN_IP）
            deny  all;
            auth_basic            "panjia-console";
            auth_basic_user_file  /etc/nginx/.htpasswd;
            limit_req zone=admin burst=50 nodelay;   # 仅非白名单 IP 被限流

            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
