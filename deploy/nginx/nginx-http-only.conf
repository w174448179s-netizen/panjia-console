# ========== Nginx IP 模式配置（HTTP only）==========
# 用于域名尚未下来、想先用 IP 测试网站是否正常的场景
# 跑 sh bin/add-domain.sh <域名> 后会自动切换到 HTTPS 模式
#
# 特点：
#   - 只 listen 80，无 HTTPS（避免自签证书在浏览器里弹警告）
#   - server_name _; 兜底所有 host（含 IP 访问、任意域名访问）
#   - 路径 / 走前端静态文件，/api/ 走后端
#   - 默认 server 标识为 IP 模式，便于后续 add-domain.sh 区分
#
# add-domain.sh 切换时做的事（参考该脚本的逻辑）：
#   1. 用 certbot --standalone 申请证书（短暂停 nginx 容器）
#   2. 替换本文件为 deploy/nginx/nginx.conf（HTTPS 版本）
#   3. docker exec panjia-console-web nginx -s reload（不重启容器）
#   4. 设置续签 cron，后续走 --webroot 不停机

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 限流：鉴权面防暴力请求
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 100m;

        # 默认兜底：前端静态文件（try_files 找路由对应的静态资源，找不到回落到 index.html 让前端 router 处理）
        location / {
            root /var/www/panjia-console;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location /assets/ {
            root /var/www/panjia-console;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 鉴权面（公网可达，限流 + JWT 防护）
        location /api/auth/ {
            limit_req zone=auth burst=40 nodelay;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # 管理面 + 业务面（暂时全开，后续加白名单取消注释即可）
        # allow 10.8.0.0/24;    # VPN 网段
        # allow 203.0.113.10;   # 运维 IP
        # deny  all;
        # 注意：必须用 /api/ 全量代理——/api/v1/* 全是业务接口，
        # 如果只代理 /api/panjia/ 之类的前缀，其余 API 会落到静态 location，
        # GET 返回 index.html、POST 直接 405
        location /api/ {
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}