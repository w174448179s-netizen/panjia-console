# ========== Nginx IP 模式配置（HTTP only）==========
# 用于域名尚未下来、想先用 IP 测试网站是否正常的场景
# 跑 sh bin/add-domain.sh <域名> 后会自动切换到 HTTPS 模式
#
# 特点：
#   - 只 listen 80，无 HTTPS（避免自签证书在浏览器里弹警告）
#   - server_name _; 兜底所有 host（含 IP 访问、任意域名访问）
#   - 路径 / 走前端静态文件，/api/ 走后端
#   - 默认 server 标识为 IP 模式，便于后续 add-domain.sh 区分
#
# add-domain.sh 切换时做的事（参考该脚本的逻辑）：
#   1. 用 certbot --standalone 申请证书（短暂停 nginx 容器）
#   2. 替换本文件为 deploy/nginx/nginx.conf（HTTPS 版本）
#   3. docker exec panjia-console-web nginx -s reload（不重启容器）
#   4. 设置续签 cron，后续走 --webroot 不停机

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 限流：激活接口防暴力枚举（5r/m，仅允许极少量重试）
    limit_req_zone $binary_remote_addr zone=activate:10m rate=5r/m;
    # 限流：心跳/Check 正常业务流量（30r/m）
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    # 连接数限制（防单 IP 连接耗尽）
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # ---------- 管理面访问控制 ----------
    # ADMIN_IP = 182.136.186.40（2026-09-05 生效，家宽 IP 变动后改这里）
    # satisfy any：白名单 IP 免密直入；其余 IP 凭 Basic Auth 兜底进入
    # 管理面限流：geo + map 让白名单 IP 限流键为空（不限速），陌生人 30r/m
    geo $is_admin_ip {
        default           0;
        182.136.186.40    1;   # ADMIN_IP
    }
    map $is_admin_ip $admin_limit_key {
        0     $binary_remote_addr;
        1     "";
    }
    limit_req_zone $admin_limit_key zone=admin:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 100m;

        # 容器健康检查端点
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # 官网首页（公开，无认证）
        location / {
            root /var/www/home;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # /console → /console/（补全末尾斜杠，否则落到 location / 返回首页）
        location = /console {
            return 301 /console/;
        }

        # 管理后台 SPA（/console/，IP 白名单 + Basic Auth）
        location /console/ {
            satisfy any;
            allow 182.136.186.40;   # 你的机器（ADMIN_IP）
            deny  all;
            auth_basic            "panjia-console";
            auth_basic_user_file  /etc/nginx/.htpasswd;

            limit_req zone=admin burst=50 nodelay;   # 仅非白名单 IP 被限流

            root /var/www;
            try_files $uri $uri/ /console/index.html;
        }

        # 后台静态资源缓存（同样锁定）
        location /console/assets/ {
            satisfy any;
            allow 182.136.186.40;   # 你的机器（ADMIN_IP）
            deny  all;
            auth_basic            "panjia-console";
            auth_basic_user_file  /etc/nginx/.htpasswd;

            limit_req zone=admin burst=50 nodelay;   # 仅非白名单 IP 被限流

            root /var/www;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 鉴权面（公网可达，限流 + JWT 防护）
        # 激活接口（严格限流：5r/m，防授权码暴力枚举）
        location /api/auth/activate {
            limit_req zone=activate burst=10 nodelay;
            limit_conn conn_per_ip 5;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # 心跳/Check 接口（正常限流：30r/m）
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            limit_conn conn_per_ip 10;
            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # 管理面 API（IP 白名单 + Basic Auth；注意 /api/ 必须全量代理）
        location /api/ {
            satisfy any;
            allow 182.136.186.40;   # 你的机器（ADMIN_IP）
            deny  all;
            auth_basic            "panjia-console";
            auth_basic_user_file  /etc/nginx/.htpasswd;

            limit_req zone=admin burst=50 nodelay;   # 仅非白名单 IP 被限流

            proxy_pass http://console:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}